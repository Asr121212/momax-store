<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قائمة المهام - Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">📝 قائمة مهامي</h1>
                <p class="app-subtitle">تنظيم يومك بكل سهولة</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        placeholder="أضف مهمة جديدة..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-btn">
                        <span>➕</span>
                        <span>إضافة</span>
                    </button>
                </div>
                <div class="input-help">اضغط Enter أو انقر على الزر لإضافة مهمة</div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">إجمالي المهام</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">مكتملة</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">قيد الانتظار</div>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    كل المهام
                </button>
                <button class="filter-btn" data-filter="pending">
                    قيد الانتظار
                </button>
                <button class="filter-btn" data-filter="completed">
                    مكتملة
                </button>
            </section>

            <!-- Sorting Section -->
            <section class="sort-section">
                <label for="sortSelect">ترتيب:</label>
                <select id="sortSelect" class="sort-select">
                    <option value="newest">الأحدث أولاً</option>
                    <option value="oldest">الأقدم أولاً</option>
                    <option value="name">حسب الاسم (أ-ي)</option>
                    <option value="completed">المكتملة أولاً</option>
                </select>
            </section>

            <!-- Tasks List Section -->
            <section class="tasks-section">
                <div id="todosList" class="todos-list">
                    <!-- Tasks will be displayed here -->
                </div>
                
                <!-- Empty State -->
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon">📭</div>
                    <h3>لا توجد مهام</h3>
                    <p>ابدأ بإضافة مهمتك الأولى الآن!</p>
                </div>
            </section>

            <!-- Actions Section -->
            <section class="actions-section">
                <button id="clearCompletedBtn" class="action-btn danger-btn hidden">
                    🗑️ حذف المهام المكتملة
                </button>
                <button id="clearAllBtn" class="action-btn danger-btn hidden">
                    🔥 حذف جميع المهام
                </button>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>💡 نصيحة: جميع مهامك محفوظة تلقائياً في جهازك</p>
        </footer>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تعديل المهمة</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <input 
                    type="text" 
                    id="editInput" 
                    class="edit-input" 
                    placeholder="نص المهمة..."
                >
            </div>
            <div class="modal-footer">
                <button id="saveEditBtn" class="btn btn-primary">حفظ</button>
                <button id="cancelEditBtn" class="btn btn-secondary">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
